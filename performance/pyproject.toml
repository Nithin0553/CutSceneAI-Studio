[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutsceneai-performance"
version = "0.1.0"
description = "Engine-neutral generated performance packages for CutSceneAI Studio"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.22.0,<5.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.5.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cutsceneai_performance*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
